services:
  # =========================================================================
  # 1. CRM Backend Web Service (NestJS + Prisma + PostgreSQL)
  # =========================================================================
  - type: web
    name: crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # =========================================================================
  # 2. CRM Frontend Static Site (Vite React Single Page App)
  # =========================================================================
  - type: web
    name: crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: crm-backend
          property: host
